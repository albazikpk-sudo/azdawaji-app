name: Build Android
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AzdawajiApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd AzdawajiApp && gradle assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: AzdawajiApp/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: AzdawajiApp/app/build/outputs/bundle/release/*.aab
